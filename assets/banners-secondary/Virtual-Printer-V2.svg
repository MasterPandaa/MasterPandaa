  <g transform="translate(48, 226)">
    <!-- GitHub Octocat Icon -->
    <path d="M 8 0 C 3.58 0 0 3.58 0 8 C 0 11.54 2.29 14.53 5.47 15.59 C 5.87 15.66 6.02 15.42 6.02 15.21 C 6.02 15.02 6.01 14.39 6.01 13.72 C 4 14.09 3.48 13.23 3.32 12.78 C 3.23 12.55 2.84 11.84 2.5 11.65 C 2.22 11.5 1.82 11.13 2.49 11.12 C 3.12 11.11 3.57 11.7 3.72 11.94 C 4.44 13.15 5.59 12.81 6.05 12.6 C 6.12 12.08 6.33 11.73 6.56 11.53 C 4.78 11.33 2.92 10.64 2.92 7.58 C 2.92 6.71 3.23 5.99 3.74 5.43 C 3.66 5.23 3.38 4.41 3.82 3.31 C 3.82 3.31 4.49 3.1 6.02 4.13 C 6.66 3.95 7.34 3.86 8.02 3.86 C 8.7 3.86 9.38 3.95 10.02 4.13 C 11.55 3.09 12.22 3.31 12.22 3.31 C 12.66 4.41 12.38 5.23 12.3 5.43 C 12.81 5.99 13.12 6.7 13.12 7.58 C 13.12 10.65 11.25 11.33 9.47 11.53 C 9.76 11.78 10.01 12.26 10.01 13.01 C 10.01 14.08 10 14.94 10 15.21 C 10 15.42 10.15 15.67 10.55 15.59 C 13.71 14.53 16 11.53 16 8 C 16 3.58 12.42 0 8 0 Z" fill="#64748B"/>
    <text x="24" y="12.5" fill="#64748B" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="500">MasterPandaa / Virtual-Printer-V2</text>
    
    <!-- Status Pill -->
    <rect x="235" y="-1" width="62" height="18" rx="3" fill="#12121C" stroke="#252538" stroke-width="1"/>
    <circle cx="243" cy="8" r="2.5" fill="#10B981"/>
    <text x="250" y="11.5" fill="#94A3B8" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="600">ACTIVE</text>
  </g>

  <!-- 4. Right Column Geometric Vector Motif -->
  
    <g transform="translate(670, 35)">
      <!-- Multi-Port Server Enclosure -->
      <rect x="30" y="30" width="170" height="145" rx="8" fill="#12121C" stroke="#F97316" stroke-width="2"/>

      <!-- 4 Concurrent Network Ports Grid -->
      <!-- Port 9100 -->
      <rect x="45" y="45" width="65" height="38" rx="4" fill="#0D0D14" stroke="#F97316" stroke-width="1.5"/>
      <circle cx="55" cy="56" r="3" fill="#10B981"/>
      <text x="63" y="59" fill="#FED7AA" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="700">:9100</text>
      <text x="55" y="73" fill="#64748B" font-family="'SF Mono', Consolas, monospace" font-size="7">SPOOL A</text>

      <!-- Port 9101 -->
      <rect x="120" y="45" width="65" height="38" rx="4" fill="#0D0D14" stroke="#F97316" stroke-width="1.5"/>
      <circle cx="130" cy="56" r="3" fill="#10B981"/>
      <text x="138" y="59" fill="#FED7AA" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="700">:9101</text>
      <text x="130" y="73" fill="#64748B" font-family="'SF Mono', Consolas, monospace" font-size="7">SPOOL B</text>

      <!-- Port 9102 -->
      <rect x="45" y="95" width="65" height="38" rx="4" fill="#0D0D14" stroke="#F97316" stroke-width="1.5"/>
      <circle cx="55" cy="106" r="3" fill="#10B981"/>
      <text x="63" y="109" fill="#FED7AA" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="700">:9102</text>
      <text x="55" y="123" fill="#64748B" font-family="'SF Mono', Consolas, monospace" font-size="7">SPOOL C</text>

      <!-- Port 9103 -->
      <rect x="120" y="95" width="65" height="38" rx="4" fill="#0D0D14" stroke="#F97316" stroke-width="1.5"/>
      <circle cx="130" cy="106" r="3" fill="#10B981"/>
      <text x="138" y="109" fill="#FED7AA" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="700">:9103</text>
      <text x="130" y="123" fill="#64748B" font-family="'SF Mono', Consolas, monospace" font-size="7">SPOOL D</text>

      <!-- Threading Multi-Channel Bus -->
      <line x1="45" y1="150" x2="185" y2="150" stroke="#FED7AA" stroke-width="2"/>
      <circle cx="77" cy="150" r="3" fill="#FFFFFF"/>
      <circle cx="152" cy="150" r="3" fill="#FFFFFF"/>

      <!-- Status Badge -->
      <rect x="48" y="190" width="134" height="18" rx="4" fill="#0D0D14" stroke="#F97316" stroke-width="1"/>
      <text x="115" y="202" fill="#FED7AA" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="600" text-anchor="middle">4-CHANNEL THREADED</text>
    </g>
    
</svg>