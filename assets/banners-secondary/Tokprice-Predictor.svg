<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid-Tokprice-Predictor" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
    
    <!-- Ambient Radial Accent Glow -->
    <radialGradient id="glow-Tokprice-Predictor" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#008848" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#052E16" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Linear Gradient for Canvas -->
    <linearGradient id="bg-grad-Tokprice-Predictor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12121A"/>
      <stop offset="100%" stop-color="#09090D"/>
    </linearGradient>
  </defs>

  <!-- 1. Canvas Base & Grid -->
  <rect width="960" height="280" rx="12" fill="url(#bg-grad-Tokprice-Predictor)"/>
  <rect width="960" height="280" rx="12" fill="url(#grid-Tokprice-Predictor)"/>
  <rect width="960" height="280" rx="12" fill="url(#glow-Tokprice-Predictor)"/>

  <!-- 2. Architectural Borders -->
  <rect x="0.75" y="0.75" width="958.5" height="278.5" rx="11.25" fill="none" stroke="#222232" stroke-width="1.5"/>
  <!-- Top Accent Highlight -->
  <line x1="48" y1="1" x2="280" y2="1" stroke="#00AA5B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 3. Left Column Content -->
  <!-- Category Badge -->
  <g transform="translate(48, 38)">
    <rect width="203.5" height="22" rx="4" fill="#052E16" fill-opacity="0.35" stroke="#00AA5B" stroke-width="1.2"/>
    <circle cx="12" cy="11" r="3" fill="#00AA5B"/>
    <text x="22" y="14.5" fill="#4ADE80" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1.2">PREDICTIVE MACHINE LEARNING</text>
  </g>

  <!-- Title -->
  <text x="48" y="98" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="29" font-weight="800" letter-spacing="-0.5">Tokprice-Predictor</text>

  <!-- Subtitle / Tagline -->
  <text x="48" y="128" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">E-Commerce Product Pricing Estimator via TF-IDF &amp; Ridge Regression</text>

  <!-- Tech Stack Badges -->
  
        <g transform="translate(48, 158)">
          <rect width="61.2" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="30.6" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Python</text>
        </g>
        
        <g transform="translate(117.2, 158)">
          <rect width="140.4" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="70.2" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">TF-IDF Vectorizer</text>
        </g>
        
        <g transform="translate(265.6, 158)">
          <rect width="133.2" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="66.6" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Ridge Regression</text>
        </g>
        
        <g transform="translate(406.8, 158)">
