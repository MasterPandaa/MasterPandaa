      <circle cx="120" cy="95" r="3.5" fill="#6EE7B7"/>
      <circle cx="135" cy="80" r="3.5" fill="#6EE7B7"/>
      <circle cx="150" cy="75" r="3.5" fill="#6EE7B7"/>
