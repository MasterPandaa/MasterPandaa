      <line x1="45" y1="145" x2="185" y2="50" stroke="#00AA5B" stroke-width="3" stroke-linecap="round"/>

      <!-- Price Tag Badge in Foreground -->
      <g transform="translate(130, 95)">
        <polygon points="10,5 35,5 45,15 25,35 5,15" fill="#181824" stroke="#4ADE80" stroke-width="1.8"/>
        <circle cx="16" cy="12" r="2.5" fill="#FFFFFF"/>
        <text x="25" y="24" fill="#4ADE80" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="700">Rp</text>
      </g>

      <!-- Status Badge -->
      <rect x="52" y="190" width="126" height="18" rx="4" fill="#0D0D14" stroke="#00AA5B" stroke-width="1"/>
      <text x="115" y="202" fill="#4ADE80" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="600" text-anchor="middle">RIDGE REGRESSION R²: 0.78</text>
    </g>
    
</svg>