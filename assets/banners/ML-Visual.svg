<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid-ML-Visual" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
    
    <!-- Ambient Radial Accent Glow -->
    <radialGradient id="glow-ML-Visual" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#4C1D95" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Linear Gradient for Canvas -->
    <linearGradient id="bg-grad-ML-Visual" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12121A"/>
      <stop offset="100%" stop-color="#09090D"/>
    </linearGradient>
  </defs>

  <!-- 1. Canvas Base & Grid -->
  <rect width="960" height="280" rx="12" fill="url(#bg-grad-ML-Visual)"/>
  <rect width="960" height="280" rx="12" fill="url(#grid-ML-Visual)"/>
  <rect width="960" height="280" rx="12" fill="url(#glow-ML-Visual)"/>

  <!-- 2. Architectural Borders -->
  <rect x="0.75" y="0.75" width="958.5" height="278.5" rx="11.25" fill="none" stroke="#222232" stroke-width="1.5"/>
  <!-- Top Accent Highlight -->
  <line x1="48" y1="1" x2="280" y2="1" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 3. Left Column Content -->
  <!-- Category Badge -->
  <g transform="translate(48, 38)">
    <rect width="197.0" height="22" rx="4" fill="#4C1D95" fill-opacity="0.35" stroke="#8B5CF6" stroke-width="1.2"/>
    <circle cx="12" cy="11" r="3" fill="#8B5CF6"/>
    <text x="22" y="14.5" fill="#C4B5FD" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1.2">MACHINE LEARNING EDUCATION</text>
  </g>

  <!-- Title -->
  <text x="48" y="98" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="29" font-weight="800" letter-spacing="-0.5">ML-Visual</text>

  <!-- Subtitle / Tagline -->
  <text x="48" y="128" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Interactive Decision Boundary &amp; Optimization Landscape Visualizer</text>

  <!-- Tech Stack Badges -->
  
        <g transform="translate(48, 158)">
          <rect width="68.4" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="34.2" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Next.js</text>
        </g>
        
        <g transform="translate(124.4, 158)">
          <rect width="90.0" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="45.0" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">TypeScript</text>
        </g>
        
        <g transform="translate(222.4, 158)">
          <rect width="82.8" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="41.4" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Canvas 2D</text>
        </g>
        
        <g transform="translate(313.2, 158)">
          <rect width="111.6" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="55.8" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">ML Algorithms</text>
        </g>
        
        <g transform="translate(432.8, 158)">
          <rect width="104.4" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="52.2" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Tailwind CSS</text>
        </g>
        

  <!-- Footer Metadata & GitHub Repository Info -->
  <g transform="translate(48, 226)">
    <!-- GitHub Octocat Icon -->
    <path d="M 8 0 C 3.58 0 0 3.58 0 8 C 0 11.54 2.29 14.53 5.47 15.59 C 5.87 15.66 6.02 15.42 6.02 15.21 C 6.02 15.02 6.01 14.39 6.01 13.72 C 4 14.09 3.48 13.23 3.32 12.78 C 3.23 12.55 2.84 11.84 2.5 11.65 C 2.22 11.5 1.82 11.13 2.49 11.12 C 3.12 11.11 3.57 11.7 3.72 11.94 C 4.44 13.15 5.59 12.81 6.05 12.6 C 6.12 12.08 6.33 11.73 6.56 11.53 C 4.78 11.33 2.92 10.64 2.92 7.58 C 2.92 6.71 3.23 5.99 3.74 5.43 C 3.66 5.23 3.38 4.41 3.82 3.31 C 3.82 3.31 4.49 3.1 6.02 4.13 C 6.66 3.95 7.34 3.86 8.02 3.86 C 8.7 3.86 9.38 3.95 10.02 4.13 C 11.55 3.09 12.22 3.31 12.22 3.31 C 12.66 4.41 12.38 5.23 12.3 5.43 C 12.81 5.99 13.12 6.7 13.12 7.58 C 13.12 10.65 11.25 11.33 9.47 11.53 C 9.76 11.78 10.01 12.26 10.01 13.01 C 10.01 14.08 10 14.94 10 15.21 C 10 15.42 10.15 15.67 10.55 15.59 C 13.71 14.53 16 11.53 16 8 C 16 3.58 12.42 0 8 0 Z" fill="#64748B"/>
    <text x="24" y="12.5" fill="#64748B" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="500">MasterPandaa / ML-Visual</text>
    
    <!-- Status Pill -->
    <rect x="235" y="-1" width="62" height="18" rx="3" fill="#12121C" stroke="#252538" stroke-width="1"/>
    <circle cx="243" cy="8" r="2.5" fill="#10B981"/>
    <text x="250" y="11.5" fill="#94A3B8" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="600">ACTIVE</text>
  </g>

  <!-- 4. Right Column Geometric Vector Motif -->
  
    <g transform="translate(670, 35)">
      <!-- 2D Coordinate Grid Frame -->
      <rect x="25" y="25" width="180" height="150" rx="8" fill="#0F0F16" stroke="#252538" stroke-width="1.5"/>
      <line x1="35" y1="160" x2="195" y2="160" stroke="#475569" stroke-width="1.5"/>
      <line x1="35" y1="160" x2="35" y2="35" stroke="#475569" stroke-width="1.5"/>

      <!-- Scatter Points Cluster A (Top Left) -->
      <circle cx="65" cy="55" r="4.5" fill="#C4B5FD"/>
      <circle cx="85" cy="45" r="4.5" fill="#C4B5FD"/>
      <circle cx="60" cy="80" r="4.5" fill="#C4B5FD"/>
      <circle cx="80" cy="70" r="4.5" fill="#C4B5FD"/>
      <circle cx="100" cy="60" r="4.5" fill="#C4B5FD"/>
      <circle cx="75" cy="95" r="4.5" fill="#C4B5FD"/>

      <!-- Scatter Points Cluster B (Bottom Right) -->
      <polygon points="140,115 145,120 140,125 135,120" fill="#38BDF8"/>
      <polygon points="160,105 165,110 160,115 155,110" fill="#38BDF8"/>
      <polygon points="175,125 180,130 175,135 170,130" fill="#38BDF8"/>
      <polygon points="150,140 155,145 150,150 145,145" fill="#38BDF8"/>
      <polygon points="170,145 175,150 170,155 165,150" fill="#38BDF8"/>
      <polygon points="135,145 140,150 135,155 130,145" fill="#38BDF8"/>

      <!-- Hyperplane Decision Boundary -->
      <line x1="45" y1="145" x2="185" y2="45" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="35" y1="135" x2="175" y2="35" stroke="#4C1D95" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="55" y1="155" x2="195" y2="55" stroke="#4C1D95" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- Formula Tag -->
      <rect x="95" y="130" width="95" height="18" rx="4" fill="#181824" stroke="#8B5CF6" stroke-width="1"/>
      <text x="142" y="142" fill="#E2E8F0" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="700" text-anchor="middle">w·x + b = 0</text>

      <!-- Status Badge -->
      <rect x="52" y="190" width="126" height="18" rx="4" fill="#0D0D14" stroke="#8B5CF6" stroke-width="1"/>
      <text x="115" y="202" fill="#C4B5FD" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="600" text-anchor="middle">DECISION BOUNDARY</text>
    </g>
    
</svg>