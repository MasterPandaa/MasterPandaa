<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 280" width="960" height="280">
  <defs>
    <!-- Background Micro-Grid Pattern -->
    <pattern id="grid-Sentilytics-AI" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#FFFFFF" fill-opacity="0.035"/>
    </pattern>

    <!-- Ambient Radial Halo behind Brand Logo -->
    <radialGradient id="halo-Sentilytics-AI" cx="138" cy="140" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#064E3B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#08080C" stop-opacity="0"/>
    </radialGradient>

    <!-- Canvas Linear Gradient -->
    <linearGradient id="bg-grad-Sentilytics-AI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F18"/>
      <stop offset="50%" stop-color="#0A0A10"/>
      <stop offset="100%" stop-color="#07070A"/>
    </linearGradient>

    <!-- Brand Card Glassmorphic Shading -->
    <linearGradient id="card-grad-Sentilytics-AI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161624" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0D0D14" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- 1. Background Layers -->
  <rect width="960" height="280" rx="12" fill="url(#bg-grad-Sentilytics-AI)"/>
  <rect width="960" height="280" rx="12" fill="url(#grid-Sentilytics-AI)"/>
  <rect width="960" height="280" rx="12" fill="url(#halo-Sentilytics-AI)"/>

  <!-- 2. Architectural Outer Border & Top Accent Line -->
  <rect x="0.75" y="0.75" width="958.5" height="278.5" rx="11.25" fill="none" stroke="#222234" stroke-width="1.5"/>
  <line x1="48" y1="1" x2="260" y2="1" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 3. Left Brand Showcase Card (180x180 px) -->
  <g transform="translate(48, 50)">
    <!-- Card Frame Base -->
    <rect width="180" height="180" rx="18" fill="url(#card-grad-Sentilytics-AI)" stroke="#25253A" stroke-width="1.5"/>
    <!-- Inner Border Glow -->
    <rect x="1.5" y="1.5" width="177" height="177" rx="16.5" fill="none" stroke="#059669" stroke-width="1" stroke-opacity="0.25"/>
    <!-- Precision Corner Alignment Brackets -->
    <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <path d="M 168 156 L 168 168 L 156 168" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Brand Logo / Emblem Layer -->
  
    <!-- Sentilytics-AI Dual-Polarity Sentiment Wave & Gauge Mark -->
    <circle cx="138" cy="140" r="58" fill="#064E3B" fill-opacity="0.3"/>
    <!-- Sinusoidal Background Wave -->
    <path d="M 88 140 Q 100 114 114 140 T 138 140 T 162 140 T 188 140" fill="none" stroke="#064E3B" stroke-width="3" stroke-linecap="round"/>
    <!-- Dial Outer Ring -->
    <circle cx="138" cy="140" r="44" fill="#0E1E16" stroke="#059669" stroke-width="2.2"/>
    <!-- Dial Gauge Arc (135 to 405 deg) -->
    <!-- Negative Half (Red/Amber) -->
    <path d="M 107 171 A 44 44 0 0 1 138 96" fill="none" stroke="#F59E0B" stroke-width="4"/>
    <!-- Positive Half (Emerald) -->
    <path d="M 138 96 A 44 44 0 0 1 169 171" fill="none" stroke="#34D399" stroke-width="4"/>
    <!-- Dial Tick Marks -->
    <line x1="114" y1="124" x2="119" y2="128" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="138" y1="102" x2="138" y2="108" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="162" y1="124" x2="157" y2="128" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Needle Pointing to Positive (+0.85) -->
    <line x1="138" y1="140" x2="162" y2="116" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
    <circle cx="138" cy="140" r="6" fill="#FFFFFF"/>
    <circle cx="138" cy="140" r="3" fill="#0E1E16"/>
    <!-- Polarity Signs -->
    <text x="114" y="166" fill="#F59E0B" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="800">-</text>
    <text x="156" y="166" fill="#34D399" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="800">+</text>
    

  <!-- 4. Right Column Content -->
  <!-- Header Badges Row (y: 50) -->
  <g transform="translate(256, 50)">
    <!-- Category Pill -->
    <rect width="179.8" height="24" rx="4" fill="#064E3B" fill-opacity="0.32" stroke="#059669" stroke-width="1.2"/>
    <circle cx="12" cy="12" r="3.5" fill="#059669"/>
    <text x="22" y="15.5" fill="#34D399" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">REAL-TIME NLP ANALYTICS</text>

    <!-- Official Repo Badge -->
    <g transform="translate(189.8, 0)">
      <rect width="108" height="24" rx="4" fill="#141422" stroke="#25253A" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#10B981"/>
      <text x="22" y="15.5" fill="#94A3B8" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="0.5">OFFICIAL REPO</text>
    </g>
  </g>

  <!-- Brand Display Title (y: 110) -->
  <text x="256" y="112" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="31" font-weight="800" letter-spacing="-0.6">Sentilytics-AI</text>

  <!-- Subtitle / Value Proposition (y: 142) -->
  <text x="256" y="142" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">Django Real-Time Sentiment Analysis Engine &amp; Corpus Visualizer</text>

  <!-- Tech Stack Pills (y: 168) -->
  
        <g transform="translate(256.0, 168)">
          <rect width="58.8" height="24" rx="4" fill="#13131F" stroke="#232338" stroke-width="1"/>
          <text x="29.4" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Django</text>
        </g>
        
        <g transform="translate(322.8, 168)">
          <rect width="54.0" height="24" rx="4" fill="#13131F" stroke="#232338" stroke-width="1"/>
          <text x="27.0" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">NLTK</text>
        </g>
        
        <g transform="translate(384.8, 168)">
          <rect width="58.8" height="24" rx="4" fill="#13131F" stroke="#232338" stroke-width="1"/>
          <text x="29.4" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">TF-IDF</text>
        </g>
        
        <g transform="translate(451.6, 168)">
          <rect width="72.4" height="24" rx="4" fill="#13131F" stroke="#232338" stroke-width="1"/>
          <text x="36.2" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Chart.js</text>
        </g>
        
        <g transform="translate(532.0, 168)">
          <rect width="126.8" height="24" rx="4" fill="#13131F" stroke="#232338" stroke-width="1"/>
          <text x="63.4" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Python Sentiment</text>
        </g>
        

  <!-- Bottom Metadata Row (y: 228) -->
  <g transform="translate(256, 226)">
    <!-- GitHub Octocat Icon -->
    <path d="M 8 0 C 3.58 0 0 3.58 0 8 C 0 11.54 2.29 14.53 5.47 15.59 C 5.87 15.66 6.02 15.42 6.02 15.21 C 6.02 15.02 6.01 14.39 6.01 13.72 C 4 14.09 3.48 13.23 3.32 12.78 C 3.23 12.55 2.84 11.84 2.5 11.65 C 2.22 11.5 1.82 11.13 2.49 11.12 C 3.12 11.11 3.57 11.7 3.72 11.94 C 4.44 13.15 5.59 12.81 6.05 12.6 C 6.12 12.08 6.33 11.73 6.56 11.53 C 4.78 11.33 2.92 10.64 2.92 7.58 C 2.92 6.71 3.23 5.99 3.74 5.43 C 3.66 5.23 3.38 4.41 3.82 3.31 C 3.82 3.31 4.49 3.1 6.02 4.13 C 6.66 3.95 7.34 3.86 8.02 3.86 C 8.7 3.86 9.38 3.95 10.02 4.13 C 11.55 3.09 12.22 3.31 12.22 3.31 C 12.66 4.41 12.38 5.23 12.3 5.43 C 12.81 5.99 13.12 6.7 13.12 7.58 C 13.12 10.65 11.25 11.33 9.47 11.53 C 9.76 11.78 10.01 12.26 10.01 13.01 C 10.01 14.08 10 14.94 10 15.21 C 10 15.42 10.15 15.67 10.55 15.59 C 13.71 14.53 16 11.53 16 8 C 16 3.58 12.42 0 8 0 Z" fill="#64748B"/>
    <text x="24" y="12.5" fill="#64748B" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="500">MasterPandaa / Sentilytics-AI</text>

    <!-- Active Status Badge -->
    <rect x="235" y="-1" width="62" height="18" rx="3" fill="#12121C" stroke="#252538" stroke-width="1"/>
    <circle cx="243" cy="8" r="2.5" fill="#10B981"/>
    <text x="250" y="11.5" fill="#94A3B8" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="600">ACTIVE</text>

    <!-- Secondary Architecture Blueprint Hint -->
    <g transform="translate(436, -2)">
      <rect width="218" height="20" rx="3" fill="#101018" stroke="#222234" stroke-width="1"/>
      <circle cx="10" cy="10" r="2" fill="#059669"/>
      <text x="18" y="13.5" fill="#38BDF8" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="600">BLUEPRINT: BANNERS-SECONDARY</text>
    </g>
  </g>
</svg>