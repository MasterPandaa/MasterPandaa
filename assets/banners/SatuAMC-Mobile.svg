<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid-SatuAMC-Mobile" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
    
    <!-- Ambient Radial Accent Glow -->
    <radialGradient id="glow-SatuAMC-Mobile" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#B91C1C" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#7F1D1D" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Linear Gradient for Canvas -->
    <linearGradient id="bg-grad-SatuAMC-Mobile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12121A"/>
      <stop offset="100%" stop-color="#09090D"/>
    </linearGradient>
  </defs>

  <!-- 1. Canvas Base & Grid -->
  <rect width="960" height="280" rx="12" fill="url(#bg-grad-SatuAMC-Mobile)"/>
  <rect width="960" height="280" rx="12" fill="url(#grid-SatuAMC-Mobile)"/>
  <rect width="960" height="280" rx="12" fill="url(#glow-SatuAMC-Mobile)"/>

  <!-- 2. Architectural Borders -->
  <rect x="0.75" y="0.75" width="958.5" height="278.5" rx="11.25" fill="none" stroke="#222232" stroke-width="1.5"/>
  <!-- Top Accent Highlight -->
  <line x1="48" y1="1" x2="280" y2="1" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 3. Left Column Content -->
  <!-- Category Badge -->
  <g transform="translate(48, 38)">
    <rect width="203.5" height="22" rx="4" fill="#7F1D1D" fill-opacity="0.35" stroke="#DC2626" stroke-width="1.2"/>
    <circle cx="12" cy="11" r="3" fill="#DC2626"/>
    <text x="22" y="14.5" fill="#F87171" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1.2">HOSPITAL MOBILE APPLICATION</text>
  </g>

  <!-- Title -->
  <text x="48" y="98" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="29" font-weight="800" letter-spacing="-0.5">SatuAMC Mobile</text>

  <!-- Subtitle / Tagline -->
  <text x="48" y="128" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Integrated Hospital Attendance &amp; Biometric Leave Tracking Mobile App</text>

  <!-- Tech Stack Badges -->
  
        <g transform="translate(48, 158)">
          <rect width="68.4" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="34.2" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Flutter</text>
        </g>
        
        <g transform="translate(124.4, 158)">
          <rect width="55.0" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="27.5" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Dart</text>
        </g>
        
        <g transform="translate(187.4, 158)">
          <rect width="154.8" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="77.4" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Facial Verification</text>
        </g>
        
        <g transform="translate(350.20000000000005, 158)">
          <rect width="118.8" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="59.4" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">GPS Geofencing</text>
        </g>
        
        <g transform="translate(477.00000000000006, 158)">
          <rect width="75.6" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="37.8" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">REST API</text>
        </g>
        

  <!-- Footer Metadata & GitHub Repository Info -->
  <g transform="translate(48, 226)">
    <!-- GitHub Octocat Icon -->
    <path d="M 8 0 C 3.58 0 0 3.58 0 8 C 0 11.54 2.29 14.53 5.47 15.59 C 5.87 15.66 6.02 15.42 6.02 15.21 C 6.02 15.02 6.01 14.39 6.01 13.72 C 4 14.09 3.48 13.23 3.32 12.78 C 3.23 12.55 2.84 11.84 2.5 11.65 C 2.22 11.5 1.82 11.13 2.49 11.12 C 3.12 11.11 3.57 11.7 3.72 11.94 C 4.44 13.15 5.59 12.81 6.05 12.6 C 6.12 12.08 6.33 11.73 6.56 11.53 C 4.78 11.33 2.92 10.64 2.92 7.58 C 2.92 6.71 3.23 5.99 3.74 5.43 C 3.66 5.23 3.38 4.41 3.82 3.31 C 3.82 3.31 4.49 3.1 6.02 4.13 C 6.66 3.95 7.34 3.86 8.02 3.86 C 8.7 3.86 9.38 3.95 10.02 4.13 C 11.55 3.09 12.22 3.31 12.22 3.31 C 12.66 4.41 12.38 5.23 12.3 5.43 C 12.81 5.99 13.12 6.7 13.12 7.58 C 13.12 10.65 11.25 11.33 9.47 11.53 C 9.76 11.78 10.01 12.26 10.01 13.01 C 10.01 14.08 10 14.94 10 15.21 C 10 15.42 10.15 15.67 10.55 15.59 C 13.71 14.53 16 11.53 16 8 C 16 3.58 12.42 0 8 0 Z" fill="#64748B"/>
    <text x="24" y="12.5" fill="#64748B" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="500">MasterPandaa / SatuAMC-Mobile</text>
    
    <!-- Status Pill -->
    <rect x="235" y="-1" width="62" height="18" rx="3" fill="#12121C" stroke="#252538" stroke-width="1"/>
    <circle cx="243" cy="8" r="2.5" fill="#10B981"/>
    <text x="250" y="11.5" fill="#94A3B8" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="600">ACTIVE</text>
  </g>

  <!-- 4. Right Column Geometric Vector Motif -->
  
    <g transform="translate(670, 35)">
      <!-- Smartphone Silhouette with Biometric Target -->
      <rect x="65" y="20" width="100" height="165" rx="14" fill="#12121C" stroke="#DC2626" stroke-width="2.5"/>
      <rect x="98" y="26" width="34" height="4" rx="2" fill="#333348"/>

      <!-- Mobile Screen Display -->
      <rect x="75" y="38" width="80" height="135" rx="6" fill="#0D0D14" stroke="#252538" stroke-width="1"/>

      <!-- Biometric Facial Recognition Mesh -->
      <circle cx="115" cy="85" r="22" fill="#181826" stroke="#F87171" stroke-width="1.8" stroke-dasharray="3 3"/>
      <!-- Targeting brackets -->
      <path d="M 98 70 L 98 64 L 104 64" fill="none" stroke="#DC2626" stroke-width="2"/>
      <path d="M 132 70 L 132 64 L 126 64" fill="none" stroke="#DC2626" stroke-width="2"/>
      <path d="M 98 100 L 98 106 L 104 106" fill="none" stroke="#DC2626" stroke-width="2"/>
      <path d="M 132 100 L 132 106 L 126 106" fill="none" stroke="#DC2626" stroke-width="2"/>

      <!-- Face Contour inside mesh -->
      <circle cx="115" cy="83" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="111" cy="81" r="1.5" fill="#F87171"/>
      <circle cx="119" cy="81" r="1.5" fill="#F87171"/>
      <path d="M 111 88 Q 115 92 119 88" fill="none" stroke="#F87171" stroke-width="1.5"/>

      <!-- GPS Geolocation Pin at Bottom of Screen -->
      <g transform="translate(115, 140)">
        <path d="M 0 -12 C -6 -12 -10 -8 -10 -2 C -10 4 0 12 0 12 C 0 12 10 4 10 -2 C 10 -8 6 -12 0 -12 Z" fill="#DC2626"/>
        <circle cx="0" cy="-3" r="3.5" fill="#FFFFFF"/>
      </g>

      <!-- Status Badge -->
      <rect x="52" y="195" width="126" height="18" rx="4" fill="#0D0D14" stroke="#DC2626" stroke-width="1"/>
      <text x="115" y="207" fill="#F87171" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="600" text-anchor="middle">FLUTTER BIOMETRIC</text>
    </g>
    
</svg>