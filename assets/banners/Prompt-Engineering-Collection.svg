<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 280" width="960" height="280">
  <defs>
    <!-- Background Micro-Grid Pattern -->
    <pattern id="grid-Prompt-Engineering-Collection" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#FFFFFF" fill-opacity="0.035"/>
    </pattern>

    <!-- Ambient Radial Halo behind Brand Logo -->
    <radialGradient id="halo-Prompt-Engineering-Collection" cx="138" cy="140" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#1E1B4B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#08080C" stop-opacity="0"/>
    </radialGradient>

    <!-- Canvas Linear Gradient -->
    <linearGradient id="bg-grad-Prompt-Engineering-Collection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F18"/>
      <stop offset="50%" stop-color="#0A0A10"/>
      <stop offset="100%" stop-color="#07070A"/>
    </linearGradient>

    <!-- Brand Card Glassmorphic Shading -->
    <linearGradient id="card-grad-Prompt-Engineering-Collection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161624" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0D0D14" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- 1. Background Layers -->
  <rect width="960" height="280" rx="12" fill="url(#bg-grad-Prompt-Engineering-Collection)"/>
  <rect width="960" height="280" rx="12" fill="url(#grid-Prompt-Engineering-Collection)"/>
  <rect width="960" height="280" rx="12" fill="url(#halo-Prompt-Engineering-Collection)"/>

  <!-- 2. Architectural Outer Border & Top Accent Line -->
  <rect x="0.75" y="0.75" width="958.5" height="278.5" rx="11.25" fill="none" stroke="#222234" stroke-width="1.5"/>
  <line x1="48" y1="1" x2="260" y2="1" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 3. Left Brand Showcase Card (180x180 px) -->
  <g transform="translate(48, 50)">
    <!-- Card Frame Base -->
    <rect width="180" height="180" rx="18" fill="url(#card-grad-Prompt-Engineering-Collection)" stroke="#25253A" stroke-width="1.5"/>
    <!-- Inner Border Glow -->
    <rect x="1.5" y="1.5" width="177" height="177" rx="16.5" fill="none" stroke="#6366F1" stroke-width="1" stroke-opacity="0.25"/>
    <!-- Precision Corner Alignment Brackets -->
    <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
    <path d="M 168 156 L 168 168 L 156 168" fill="none" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Brand Logo / Emblem Layer -->
  
    <!-- Prompt-Engineering-Collection SAST Security Shield -->
    <!-- Heavy Cryptographic Shield -->
    <path d="M 138 72 L 188 90 C 188 152 138 198 138 208 C 138 198 88 152 88 90 Z" fill="#121226" stroke="#6366F1" stroke-width="2.2"/>
    <path d="M 138 80 L 178 95 C 178 146 138 186 138 194 C 138 186 98 146 98 95 Z" fill="none" stroke="#1E1B4B" stroke-width="1.2"/>
    <!-- Terminal Screen inside Shield -->
    <rect x="106" y="106" width="64" height="46" rx="5" fill="#0A0A16" stroke="#A5B4FC" stroke-width="1.5"/>
    <line x1="106" y1="116" x2="170" y2="116" stroke="#252540" stroke-width="1"/>
    <circle cx="112" cy="111" r="1.5" fill="#EF4444"/>
    <circle cx="117" cy="111" r="1.5" fill="#F59E0B"/>
    <circle cx="122" cy="111" r="1.5" fill="#10B981"/>
    <!-- SAST Prompt -->
    <text x="112" y="129" fill="#A5B4FC" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="700">&gt;_ SAST</text>
    <text x="112" y="142" fill="#10B981" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="600">&#x2713; PASS:0</text>
    <!-- AST Syntax Tree Stem -->
    <line x1="138" y1="152" x2="138" y2="178" stroke="#A5B4FC" stroke-width="2"/>
    <line x1="138" y1="165" x2="124" y2="174" stroke="#6366F1" stroke-width="1.5"/>
    <line x1="138" y1="165" x2="152" y2="174" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="124" cy="174" r="3" fill="#A5B4FC"/>
    <circle cx="152" cy="174" r="3" fill="#A5B4FC"/>
    <circle cx="138" cy="178" r="3.5" fill="#10B981"/>
    

  <!-- 4. Right Column Content -->
  <!-- Header Badges Row (y: 50) -->
  <g transform="translate(256, 50)">
    <!-- Category Pill -->
    <rect width="219.4" height="24" rx="4" fill="#1E1B4B" fill-opacity="0.32" stroke="#6366F1" stroke-width="1.2"/>
    <circle cx="12" cy="12" r="3.5" fill="#6366F1"/>
    <text x="22" y="15.5" fill="#A5B4FC" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">CYBERSECURITY &amp; ACADEMIC SAST</text>

    <!-- Official Repo Badge -->
    <g transform="translate(229.4, 0)">
      <rect width="108" height="24" rx="4" fill="#141422" stroke="#25253A" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#10B981"/>
      <text x="22" y="15.5" fill="#94A3B8" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="0.5">OFFICIAL REPO</text>
    </g>
  </g>

  <!-- Brand Display Title (y: 110) -->
  <text x="256" y="112" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="31" font-weight="800" letter-spacing="-0.6">Prompt-Engineering SAST</text>

  <!-- Subtitle / Value Proposition (y: 142) -->
  <text x="256" y="142" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">SAST Empirical Evaluation of LLM Code Quality | Sinta 3 Journal</text>

  <!-- Tech Stack Pills (y: 168) -->
  
        <g transform="translate(256.0, 168)">
          <rect width="54.0" height="24" rx="4" fill="#13131F" stroke="#232338" stroke-width="1"/>
          <text x="27.0" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">SAST</text>
        </g>
        
        <g transform="translate(318.0, 168)">
          <rect width="65.6" height="24" rx="4" fill="#13131F" stroke="#232338" stroke-width="1"/>
          <text x="32.8" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Semgrep</text>
        </g>
        
        <g transform="translate(391.6, 168)">
          <rect width="99.6" height="24" rx="4" fill="#13131F" stroke="#232338" stroke-width="1"/>
          <text x="49.8" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">LLM Security</text>
        </g>
        
        <g transform="translate(499.2, 168)">
          <rect width="65.6" height="24" rx="4" fill="#13131F" stroke="#232338" stroke-width="1"/>
          <text x="32.8" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Sinta 3</text>
        </g>
        
        <g transform="translate(572.8, 168)">
          <rect width="120.0" height="24" rx="4" fill="#13131F" stroke="#232338" stroke-width="1"/>
          <text x="60.0" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Empirical Study</text>
        </g>
        

  <!-- Bottom Metadata Row (y: 228) -->
  <g transform="translate(256, 226)">
    <!-- GitHub Octocat Icon -->
    <path d="M 8 0 C 3.58 0 0 3.58 0 8 C 0 11.54 2.29 14.53 5.47 15.59 C 5.87 15.66 6.02 15.42 6.02 15.21 C 6.02 15.02 6.01 14.39 6.01 13.72 C 4 14.09 3.48 13.23 3.32 12.78 C 3.23 12.55 2.84 11.84 2.5 11.65 C 2.22 11.5 1.82 11.13 2.49 11.12 C 3.12 11.11 3.57 11.7 3.72 11.94 C 4.44 13.15 5.59 12.81 6.05 12.6 C 6.12 12.08 6.33 11.73 6.56 11.53 C 4.78 11.33 2.92 10.64 2.92 7.58 C 2.92 6.71 3.23 5.99 3.74 5.43 C 3.66 5.23 3.38 4.41 3.82 3.31 C 3.82 3.31 4.49 3.1 6.02 4.13 C 6.66 3.95 7.34 3.86 8.02 3.86 C 8.7 3.86 9.38 3.95 10.02 4.13 C 11.55 3.09 12.22 3.31 12.22 3.31 C 12.66 4.41 12.38 5.23 12.3 5.43 C 12.81 5.99 13.12 6.7 13.12 7.58 C 13.12 10.65 11.25 11.33 9.47 11.53 C 9.76 11.78 10.01 12.26 10.01 13.01 C 10.01 14.08 10 14.94 10 15.21 C 10 15.42 10.15 15.67 10.55 15.59 C 13.71 14.53 16 11.53 16 8 C 16 3.58 12.42 0 8 0 Z" fill="#64748B"/>
    <text x="24" y="12.5" fill="#64748B" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="500">MasterPandaa / Prompt-Engineering-Collection</text>

    <!-- Active Status Badge -->
    <rect x="235" y="-1" width="62" height="18" rx="3" fill="#12121C" stroke="#252538" stroke-width="1"/>
    <circle cx="243" cy="8" r="2.5" fill="#10B981"/>
    <text x="250" y="11.5" fill="#94A3B8" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="600">ACTIVE</text>

    <!-- Secondary Architecture Blueprint Hint -->
    <g transform="translate(436, -2)">
      <rect width="218" height="20" rx="3" fill="#101018" stroke="#222234" stroke-width="1"/>
      <circle cx="10" cy="10" r="2" fill="#6366F1"/>
      <text x="18" y="13.5" fill="#38BDF8" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="600">BLUEPRINT: BANNERS-SECONDARY</text>
    </g>
  </g>
</svg>