<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid-JansenAI" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
    
    <!-- Ambient Radial Accent Glow -->
    <radialGradient id="glow-JansenAI" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0369A1" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#0C4A6E" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Linear Gradient for Canvas -->
    <linearGradient id="bg-grad-JansenAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12121A"/>
      <stop offset="100%" stop-color="#09090D"/>
    </linearGradient>
  </defs>

  <!-- 1. Canvas Base & Grid -->
  <rect width="960" height="280" rx="12" fill="url(#bg-grad-JansenAI)"/>
  <rect width="960" height="280" rx="12" fill="url(#grid-JansenAI)"/>
  <rect width="960" height="280" rx="12" fill="url(#glow-JansenAI)"/>

  <!-- 2. Architectural Borders -->
  <rect x="0.75" y="0.75" width="958.5" height="278.5" rx="11.25" fill="none" stroke="#222232" stroke-width="1.5"/>
  <!-- Top Accent Highlight -->
  <line x1="48" y1="1" x2="280" y2="1" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 3. Left Column Content -->
  <!-- Category Badge -->
  <g transform="translate(48, 38)">
    <rect width="177.5" height="22" rx="4" fill="#0C4A6E" fill-opacity="0.35" stroke="#0284C7" stroke-width="1.2"/>
    <circle cx="12" cy="11" r="3" fill="#0284C7"/>
    <text x="22" y="14.5" fill="#7DD3FC" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1.2">CONVERSATIONAL AI &amp; NLP</text>
  </g>

  <!-- Title -->
  <text x="48" y="98" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="29" font-weight="800" letter-spacing="-0.5">JansenAI</text>

  <!-- Subtitle / Tagline -->
  <text x="48" y="128" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Context-Aware Conversational Assistant &amp; Intent Processing Engine</text>

  <!-- Tech Stack Badges -->
  
        <g transform="translate(48, 158)">
          <rect width="61.2" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="30.6" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Python</text>
        </g>
        
        <g transform="translate(117.2, 158)">
          <rect width="55.0" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="27.5" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">NLTK</text>
        </g>
        
        <g transform="translate(180.2, 158)">
          <rect width="111.6" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="55.8" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Neural Intent</text>
        </g>
        
        <g transform="translate(299.8, 158)">
