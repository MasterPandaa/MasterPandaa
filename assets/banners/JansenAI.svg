          <text x="34.2" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">PyTorch</text>
        </g>
        
        <g transform="translate(376.20000000000005, 158)">
          <rect width="82.8" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="41.4" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Flask API</text>
        </g>
        

  <!-- Footer Metadata & GitHub Repository Info -->
  <g transform="translate(48, 226)">
    <!-- GitHub Octocat Icon -->
    <path d="M 8 0 C 3.58 0 0 3.58 0 8 C 0 11.54 2.29 14.53 5.47 15.59 C 5.87 15.66 6.02 15.42 6.02 15.21 C 6.02 15.02 6.01 14.39 6.01 13.72 C 4 14.09 3.48 13.23 3.32 12.78 C 3.23 12.55 2.84 11.84 2.5 11.65 C 2.22 11.5 1.82 11.13 2.49 11.12 C 3.12 11.11 3.57 11.7 3.72 11.94 C 4.44 13.15 5.59 12.81 6.05 12.6 C 6.12 12.08 6.33 11.73 6.56 11.53 C 4.78 11.33 2.92 10.64 2.92 7.58 C 2.92 6.71 3.23 5.99 3.74 5.43 C 3.66 5.23 3.38 4.41 3.82 3.31 C 3.82 3.31 4.49 3.1 6.02 4.13 C 6.66 3.95 7.34 3.86 8.02 3.86 C 8.7 3.86 9.38 3.95 10.02 4.13 C 11.55 3.09 12.22 3.31 12.22 3.31 C 12.66 4.41 12.38 5.23 12.3 5.43 C 12.81 5.99 13.12 6.7 13.12 7.58 C 13.12 10.65 11.25 11.33 9.47 11.53 C 9.76 11.78 10.01 12.26 10.01 13.01 C 10.01 14.08 10 14.94 10 15.21 C 10 15.42 10.15 15.67 10.55 15.59 C 13.71 14.53 16 11.53 16 8 C 16 3.58 12.42 0 8 0 Z" fill="#64748B"/>
    <text x="24" y="12.5" fill="#64748B" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="500">MasterPandaa / JansenAI</text>
    
    <!-- Status Pill -->
    <rect x="235" y="-1" width="62" height="18" rx="3" fill="#12121C" stroke="#252538" stroke-width="1"/>
    <circle cx="243" cy="8" r="2.5" fill="#10B981"/>
    <text x="250" y="11.5" fill="#94A3B8" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="600">ACTIVE</text>
  </g>

  <!-- 4. Right Column Geometric Vector Motif -->
  
    <g transform="translate(670, 35)">
      <!-- Audio Waveform Spectrum & Dialogue Rings -->
      <circle cx="115" cy="100" r="80" fill="none" stroke="#252538" stroke-width="1" stroke-dasharray="4 4"/>
      <circle cx="115" cy="100" r="55" fill="none" stroke="#0C4A6E" stroke-width="1.5"/>

      <!-- Central Neural Core -->
      <circle cx="115" cy="100" r="28" fill="#181824" stroke="#0284C7" stroke-width="2.5"/>
      <polygon points="107,92 123,92 119,108 111,108" fill="#7DD3FC"/>
      <circle cx="115" cy="100" r="6" fill="#FFFFFF"/>

      <!-- Radiating Audio Waveform Frequency Bars -->
      <line x1="55" y1="100" x2="70" y2="100" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round"/>
      <line x1="160" y1="100" x2="175" y2="100" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round"/>
      <line x1="115" y1="40" x2="115" y2="55" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round"/>
      <line x1="115" y1="145" x2="115" y2="160" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round"/>

      <line x1="72" y1="65" x2="82" y2="75" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="158" y1="65" x2="148" y2="75" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="72" y1="135" x2="82" y2="125" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="158" y1="135" x2="148" y2="125" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Dialogue Arcs -->
      <path d="M 60 70 Q 115 25 170 70" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 4"/>

      <!-- Status Badge -->
      <rect x="52" y="190" width="126" height="18" rx="4" fill="#0D0D14" stroke="#0284C7" stroke-width="1"/>
      <text x="115" y="202" fill="#7DD3FC" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="600" text-anchor="middle">NLP INTENT ENGINE</text>
    </g>
    
</svg>