      <stop offset="60%" stop-color="#172554" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Linear Gradient for Canvas -->
    <linearGradient id="bg-grad-PandaaATS-Builder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12121A"/>
      <stop offset="100%" stop-color="#09090D"/>
    </linearGradient>
  </defs>

  <!-- 1. Canvas Base & Grid -->
  <rect width="960" height="280" rx="12" fill="url(#bg-grad-PandaaATS-Builder)"/>
  <rect width="960" height="280" rx="12" fill="url(#grid-PandaaATS-Builder)"/>
  <rect width="960" height="280" rx="12" fill="url(#glow-PandaaATS-Builder)"/>

