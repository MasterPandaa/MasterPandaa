          <text x="27.5" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">MySQL</text>
        </g>
        
        <g transform="translate(426.59999999999997, 158)">
          <rect width="118.8" height="24" rx="4" fill="#14141F" stroke="#26263A" stroke-width="1"/>
          <text x="59.4" y="16" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="middle">Workforce Sync</text>
        </g>
        

