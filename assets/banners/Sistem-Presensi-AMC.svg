        <circle cx="0" cy="0" r="8" fill="#D97706" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
        <circle cx="0" cy="0" r="16" fill="none" stroke="#FBBF24" stroke-width="1.5" opacity="0.6"/>
      </g>

      <!-- Digital Clock Attendance Timestamp -->
      <rect x="65" y="140" width="100" height="22" rx="4" fill="#0D0D14" stroke="#D97706" stroke-width="1.5"/>
      <text x="115" y="155" fill="#10B981" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">07:00:00 WIB</text>

      <!-- Status Badge -->
      <rect x="52" y="190" width="126" height="18" rx="4" fill="#0D0D14" stroke="#D97706" stroke-width="1"/>
      <text x="115" y="202" fill="#FBBF24" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="600" text-anchor="middle">GEOFENCE &amp; FACIAL</text>
    </g>
    
</svg>